name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 runs the PCLMUL backend (and VPCLMUL where the CPU has it); AArch64 runs the portable backend.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --release --locked

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain with clippy
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Format check (rustfmt.toml needs a nightly rustfmt)
        run: |
          rustup toolchain install nightly-2026-04-11 --profile minimal --component rustfmt
          cargo +nightly-2026-04-11 fmt --all --check
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
