name: Proofs

# The full Lean check takes about 25 minutes and several GB of disk, so it runs on request
# and once a week, not on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Fetch the Lean runtime and Mathlib cache
        working-directory: verification/lean
        run: python3 tooling/setup_lean_runtime.py
      - name: Check the proofs
        working-directory: verification/lean
        env:
          CI: "1"
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
          LEAN_NUM_THREADS: "2"
        run: python3 scripts/verify_all.py
