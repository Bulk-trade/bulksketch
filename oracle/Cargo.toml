[package]
name = "bulksketch-oracle"
version = "0.0.0"
edition = "2024"
description = "Test-only differential checks and benchmarks of bulksketch against minisketch"
publish = false

[dependencies]
bulksketch = { path = ".." }
minisketch-rs = { path = "minisketch-rs" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "decode"
harness = false
